name: build-timer

on:
  push:
    paths:
      - 'pyside_timer/**'
      - 'requirements.txt'
  workflow_dispatch: {}

jobs:
  build:
    name: Build and package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-cache-${{ runner.os }}-

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libxcb1 libx11-6 libxext6 libxrender1 libxrandr2 libsm6 libxss1 || true
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install build
        shell: bash

      - name: Build wheel / sdist
        run: |
          python -m build --wheel --no-isolation || true
        shell: bash

      - name: Ensure dist exists (Windows)
        if: runner.os == 'Windows'
        run: |
          if (!(Test-Path -Path dist)) { New-Item -ItemType Directory -Path dist | Out-Null }
        shell: powershell

      - name: Ensure dist exists (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
        shell: bash

      - name: Build executable with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --name pyside_timer pyside_timer/timer.py
        shell: powershell

      - name: Build executable with PyInstaller (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --name pyside_timer pyside_timer/timer.py
        shell: bash

      - name: List dist (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path dist) { Get-ChildItem -Force dist } else { Write-Host 'dist not found' }
        shell: powershell

      - name: List dist (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ -d dist ]; then ls -la dist; else echo "dist not found"; fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyside_timer-${{ matrix.os }}
          path: |
            dist/*
            dist/pyside_timer*
            dist/*.whl
            dist/*.tar.gz
