name: build-timer

on:
  push:
    paths:
      - 'pyside_timer/**'
      - 'requirements.txt'
  workflow_dispatch: {}

jobs:
  build:
    name: Build and package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-cache-${{ runner.os }}-

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libxcb1 libx11-6 libxext6 libxrender1 libxrandr2 libsm6 libxss1 || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install build

      - name: Build wheel / sdist
        run: |
          python -m build --wheel --no-isolation || true

      - name: Build executable with PyInstaller
        run: |
          mkdir -p dist || true
          pyinstaller --noconfirm --onefile --name pyside_timer pyside_timer/timer.py || true

      - name: List dist
        run: |
          echo "Contents of dist/"
          ls -la dist || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyside_timer-${{ matrix.os }}
          path: |
            dist/*
            dist/pyside_timer*
            dist/*.whl
            dist/*.tar.gz
